<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#176b39" />
    <title>ScoreMatch — Hors ligne</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f5f7f5; color: #17221c; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 420px); padding: 32px 24px; border: 1px solid #dce7dd; border-radius: 20px; background: white; text-align: center; box-shadow: 0 12px 36px rgb(16 24 18 / .08); }
      .mark { display: grid; place-items: center; width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 16px; background: #176b39; color: #bceac0; font-weight: 900; }
      h1 { margin: 0; font-size: 24px; letter-spacing: -.04em; }
      p { margin: 10px 0 22px; color: #66796b; line-height: 1.5; }
      button { border: 0; border-radius: 10px; padding: 12px 16px; background: #238946; color: white; font-weight: 800; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">SM</div>
      <h1>Vous êtes hors ligne</h1>
      <p>Les derniers matchs enregistrés restent disponibles dès que vous retournez dans l’application.</p>
      <button onclick="location.href='/matches'">Réessayer</button>
    </main>
  </body>
</html>
